
name: Build Zombie Survival Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Create Android configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = Zombie Survival: The Last Stand
          package.name = zombiesurvival
          package.domain = org.jatin
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,ogg,mp3,wav,txt,json
          version = 1.0.0
          requirements = python3,pygame
          orientation = landscape
          fullscreen = 1
          android.api = 35
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Survival-APK
          path: bin/*.apk
          if-no-files-found: error
